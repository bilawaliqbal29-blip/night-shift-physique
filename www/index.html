<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0B0D0C">
<meta name="description" content="Personal gym split, desi diet plan and daily tracker">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Physique">
<title>Night Shift Physique</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Inter+Tight:wght@600;700;800&display=swap">
<style>
:root{
--bg:#0B0D0C;--bg-glow:rgba(245,185,65,.10);--surface:#141816;--surface-2:#1B201E;--line:rgba(255,255,255,.08);--line-2:rgba(255,255,255,.14);
--fg:#F3F5F4;--muted:#8D9893;--faint:#5E6863;
--accent:#F5B941;--accent-2:#FF7A3D;--accent-ink:#1A1205;--accent-soft:rgba(245,185,65,.14);
--good:#4ADE80;--good-soft:rgba(74,222,128,.14);--warn:#FB923C;--blue:#60A5FA;--blue-soft:rgba(96,165,250,.14);
--shadow:0 1px 0 rgba(255,255,255,.04) inset,0 10px 30px rgba(0,0,0,.35);
--r:20px;--r-sm:14px;
--display:"Inter Tight","Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
--body:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
color-scheme:dark;
}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){
--bg:#F3F4F1;--bg-glow:rgba(194,124,14,.10);--surface:#FFFFFF;--surface-2:#F4F5F2;--line:rgba(18,22,20,.08);--line-2:rgba(18,22,20,.16);
--fg:#121614;--muted:#5F6B66;--faint:#9AA39F;
--accent:#C27C0E;--accent-2:#E2571F;--accent-ink:#FFFFFF;--accent-soft:rgba(194,124,14,.12);
--good:#16A34A;--good-soft:rgba(22,163,74,.12);--warn:#C2410C;--blue:#2563EB;--blue-soft:rgba(37,99,235,.10);
--shadow:0 1px 2px rgba(0,0,0,.04),0 8px 24px rgba(0,0,0,.06);color-scheme:light}}
:root[data-theme="light"]{
--bg:#F3F4F1;--bg-glow:rgba(194,124,14,.10);--surface:#FFFFFF;--surface-2:#F4F5F2;--line:rgba(18,22,20,.08);--line-2:rgba(18,22,20,.16);
--fg:#121614;--muted:#5F6B66;--faint:#9AA39F;
--accent:#C27C0E;--accent-2:#E2571F;--accent-ink:#FFFFFF;--accent-soft:rgba(194,124,14,.12);
--good:#16A34A;--good-soft:rgba(22,163,74,.12);--warn:#C2410C;--blue:#2563EB;--blue-soft:rgba(37,99,235,.10);
--shadow:0 1px 2px rgba(0,0,0,.04),0 8px 24px rgba(0,0,0,.06);color-scheme:light}

*{box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 var(--body);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;
background-image:radial-gradient(900px 500px at 85% -10%,var(--bg-glow),transparent 60%),radial-gradient(700px 400px at -10% 10%,rgba(255,122,61,.06),transparent 60%);background-attachment:fixed;min-height:100vh}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}
h1,h2,h3{font-family:var(--display);margin:0;letter-spacing:-.02em;line-height:1.1;text-wrap:balance}
h1{font-size:clamp(2rem,7vw,2.75rem);font-weight:800}
h2{font-size:1.3rem;font-weight:700}
h3{font-size:1.02rem;font-weight:700;letter-spacing:-.01em}
p{margin:0}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.eyebrow{font-size:.72rem;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.wrap{max-width:760px;margin:0 auto;padding:0 16px calc(120px + env(safe-area-inset-bottom,0px))}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.sp{flex:1;min-width:0}
.stack{display:flex;flex-direction:column;gap:14px}

/* ---------- top bar ---------- */
.top{position:sticky;top:0;z-index:20;padding-top:env(safe-area-inset-top,0px);background:color-mix(in srgb,var(--bg) 78%,transparent);backdrop-filter:saturate(1.4) blur(18px);-webkit-backdrop-filter:saturate(1.4) blur(18px);border-bottom:1px solid var(--line)}
.top-in{max-width:760px;margin:0 auto;padding:10px 16px 0}
.brand{display:flex;align-items:center;gap:10px}
.logo{width:34px;height:34px;border-radius:11px;background:linear-gradient(135deg,var(--accent),var(--accent-2));display:grid;place-items:center;color:var(--accent-ink);font:800 .95rem var(--display);box-shadow:0 6px 18px rgba(255,122,61,.28);flex:none}
.brand b{font:700 1rem var(--display);letter-spacing:-.01em;display:block}
.brand small{display:block;font-size:.75rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.status{display:inline-flex;align-items:center;gap:6px;font-size:.72rem;font-weight:600;color:var(--muted);background:var(--surface-2);border:1px solid var(--line);padding:5px 10px;border-radius:99px;white-space:nowrap}
.status::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--faint)}
.status.ok::before{background:var(--good);box-shadow:0 0 0 3px var(--good-soft)}
.status.err::before{background:var(--warn)}
.pills{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:10px 0 10px;margin:0 -16px;padding-inline:16px}
.pills::-webkit-scrollbar{display:none}
.pill{flex:none;padding:7px 14px;border-radius:99px;font-size:.84rem;font-weight:600;color:var(--muted);background:transparent;border:1px solid var(--line);transition:all .2s}
.pill[aria-current="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}

/* ---------- sections & cards ---------- */
section.sec{scroll-margin-top:118px;padding-top:26px}
.sec-head{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;margin-bottom:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--shadow)}
.card + .card{margin-top:12px}
.card.flat{box-shadow:none;background:var(--surface-2)}
.note{background:var(--accent-soft);border:1px solid color-mix(in srgb,var(--accent) 30%,transparent);border-radius:var(--r-sm);padding:12px 14px;font-size:.9rem}
.tip{font-size:.83rem;color:var(--muted)}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:42px;padding:0 16px;border-radius:12px;background:var(--surface-2);border:1px solid var(--line);font-weight:600;font-size:.9rem;transition:transform .12s,background .2s}
.btn:active{transform:scale(.97)}
.btn.primary{background:linear-gradient(135deg,var(--accent),var(--accent-2));border:0;color:var(--accent-ink);box-shadow:0 8px 20px rgba(255,122,61,.25)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 45%,transparent)}
.btn.sm{height:34px;padding:0 12px;font-size:.82rem;border-radius:10px}
.btn.block{width:100%}
.iconbtn{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--surface-2);border:1px solid var(--line);font-size:1.1rem;transition:transform .12s}
.iconbtn:active{transform:scale(.94)}
.iconbtn:disabled,.btn:disabled{opacity:.4;cursor:default}

/* inputs */
input[type=number],input[type=text],input[type=email],input[type=password],input[type=time],select,textarea{background:var(--surface-2);border:1px solid var(--line);border-radius:12px;height:42px;padding:0 12px;width:100%;min-width:0;font-variant-numeric:tabular-nums;transition:border-color .2s,box-shadow .2s}
textarea{height:auto;min-height:84px;padding:10px 12px;font-size:.8rem;font-family:ui-monospace,Menlo,Consolas,monospace}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
input[type=number]::-webkit-inner-spin-button,input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
input[type=number]{-moz-appearance:textfield}
.field label,.lbl{display:block;font-size:.72rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}

/* ---------- hero ---------- */
.hero{padding-top:18px}
.hero-top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.datenav{display:flex;gap:6px;flex:none}
.daytype{display:inline-flex;align-items:center;gap:8px;margin-top:8px;color:var(--muted);font-size:.92rem}
.daytype .tag{white-space:nowrap;background:linear-gradient(135deg,var(--accent),var(--accent-2));color:var(--accent-ink);font-weight:700;font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;padding:4px 9px;border-radius:7px}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:14px -16px 0;padding:0 16px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;height:34px;padding:0 13px;border-radius:99px;border:1px solid var(--line);background:var(--surface);font-size:.83rem;font-weight:600;color:var(--muted);transition:all .2s}
.chip[aria-pressed="true"]{color:var(--accent-ink);background:var(--accent);border-color:var(--accent)}
.rings{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:16px}
.ring{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:12px 6px 10px;text-align:center;box-shadow:var(--shadow);min-width:0}
.ring svg{width:100%;max-width:74px;height:auto;display:block;margin:0 auto;transform:rotate(-90deg)}
.ring .trk{fill:none;stroke:var(--surface-2);stroke-width:8}
.ring .val{fill:none;stroke-width:8;stroke-linecap:round;transition:stroke-dashoffset .8s cubic-bezier(.2,.8,.2,1)}
.ring .rv{margin-top:-52px;height:40px;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none}
.ring .rv b{font:700 1.02rem var(--display);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.ring .rv small{font-size:.62rem;color:var(--muted)}
.ring .rl{display:block;margin-top:16px;font-size:.68rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.over{font-size:.75rem;color:var(--warn);text-align:center;margin-top:8px}

/* ---------- workout ---------- */
.wo-top{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.bar{height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden;flex:1}
.bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--accent),var(--accent-2));transition:width .6s cubic-bezier(.2,.8,.2,1)}
.wo-count{font:700 .86rem var(--display);font-variant-numeric:tabular-nums;color:var(--muted);white-space:nowrap}
.cardio{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:16px;background:var(--surface-2);border:1px solid var(--line);transition:background .3s,border-color .3s}
.cardio + .ex,.ex + .cardio{margin-top:10px}
.cardio.done{background:var(--blue-soft);border-color:color-mix(in srgb,var(--blue) 35%,transparent)}
.cardio .ic{width:38px;height:38px;border-radius:12px;background:var(--blue-soft);color:var(--blue);display:grid;place-items:center;flex:none}
.cardio .tx{flex:1;min-width:0}
.cardio .tx b{display:block;font-size:.95rem}
.cardio .tx small{display:block;color:var(--muted);font-size:.78rem;line-height:1.35}
.mins{display:flex;align-items:center;gap:6px;flex:none}
.mins input{width:58px;height:38px;text-align:center;padding:0 4px;font-weight:700}
.mins span{font-size:.78rem;color:var(--muted)}
@media (max-width:400px){.cardio .ic{display:none}.cardio{padding:12px}}

.ex{border:1px solid var(--line);background:var(--surface-2);border-radius:16px;transition:border-color .3s,background .3s}
.ex + .ex{margin-top:10px}
.ex.complete{background:var(--good-soft);border-color:color-mix(in srgb,var(--good) 30%,transparent)}
.ex.open{background:var(--surface);border-color:var(--line-2)}
.ex-head{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:13px 14px}
.ex-idx{width:30px;height:30px;border-radius:10px;display:grid;place-items:center;background:var(--surface);border:1px solid var(--line);font:700 .78rem var(--display);color:var(--muted);flex:none;font-variant-numeric:tabular-nums}
.ex.complete .ex-idx{background:var(--good);border-color:var(--good);color:#06240F}
.ex-title{flex:1;min-width:0}
.ex-title b{display:block;font-weight:600;font-size:.95rem;line-height:1.3}
.ex-title small{display:block;color:var(--muted);font-size:.78rem;margin-top:2px}
.ex-title small em{font-style:normal;color:var(--accent);font-weight:600}
.ex-prog{font:700 .8rem var(--display);font-variant-numeric:tabular-nums;color:var(--muted);flex:none}
.chev{flex:none;transition:transform .3s;color:var(--faint)}
.ex.open > .ex-head .chev,.meal.open .meal-row .chev{transform:rotate(180deg)}
.fold{display:grid;grid-template-rows:0fr;transition:grid-template-rows .35s cubic-bezier(.2,.8,.2,1)}
.ex.open > .fold,.meal.open .meal-card > .fold{grid-template-rows:1fr}
.fold > div{min-height:0;overflow:hidden}
.ex-body{padding:0 14px 14px}
.ex-tools{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap;margin-bottom:10px}
.kg{flex:1;min-width:120px}
.kg .in{position:relative}
.kg .in input{padding-right:38px;font-weight:700}
.kg .in span{position:absolute;right:12px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:.8rem}
.stepper{display:flex;align-items:center;gap:4px;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:3px;height:42px}
.stepper button{width:34px;height:34px;border-radius:9px;font-size:1.15rem;font-weight:600;display:grid;place-items:center}
.stepper button:active{background:var(--line)}
.stepper span{min-width:58px;text-align:center;font-size:.82rem;font-weight:600}
.set{display:grid;grid-template-columns:54px 1fr 46px;gap:8px;align-items:center;padding:5px 0}
.set-no{font-size:.78rem;font-weight:600;color:var(--muted)}
.set input{text-align:center;font-weight:700}
.tick{width:46px;height:42px;border-radius:12px;border:1.5px solid var(--line-2);display:grid;place-items:center;color:var(--faint);transition:all .2s;background:transparent;flex:none}
.tick svg{width:20px;height:20px}
.tick[aria-pressed="true"]{background:var(--good);border-color:var(--good);color:#06240F;transform:scale(1)}
.tick.pop{animation:pop .35s}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.15)}100%{transform:scale(1)}}
.set.done input{border-color:color-mix(in srgb,var(--good) 40%,transparent);background:var(--good-soft)}
.ex-body .tip{margin-top:8px}
.finish{margin-top:14px}
.donebox{display:flex;align-items:center;gap:12px;padding:14px;border-radius:16px;background:var(--good-soft);border:1px solid color-mix(in srgb,var(--good) 35%,transparent)}
.donebox .ic{width:40px;height:40px;border-radius:50%;background:var(--good);color:#06240F;display:grid;place-items:center;flex:none}

/* ---------- meals ---------- */
.meal{position:relative;padding-left:22px}
.meal::before{content:"";position:absolute;left:6px;top:0;bottom:0;width:2px;background:var(--line)}
.meal:first-child::before{top:22px}.meal:last-child::before{bottom:calc(100% - 22px)}
.meal::after{content:"";position:absolute;left:1px;top:17px;width:12px;height:12px;border-radius:50%;background:var(--surface);border:2px solid var(--line-2);transition:all .3s}
.meal.done::after{background:var(--good);border-color:var(--good)}
.meal + .meal{margin-top:8px}
.meal-card{border-radius:16px;background:var(--surface-2);border:1px solid var(--line);transition:background .3s,border-color .3s}
.meal.done .meal-card{background:var(--good-soft);border-color:color-mix(in srgb,var(--good) 25%,transparent)}
.meal-row{display:flex;align-items:center;gap:12px;padding:12px 12px 12px 14px}
.meal-main{flex:1;min-width:0;text-align:left;display:block}
.meal-main .t{font-size:.74rem;font-weight:700;color:var(--accent);letter-spacing:.04em}
.meal-main b{display:block;font-size:.98rem;font-weight:600}
.meal-main small{display:block;color:var(--muted);font-size:.78rem}
.meal-items{padding:0 14px 14px;color:var(--muted);font-size:.88rem;line-height:1.5}

.qp{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:10px -18px 0;padding:2px 18px 4px}
.qp::-webkit-scrollbar{display:none}
.qchip{flex:none;display:flex;flex-direction:column;align-items:flex-start;gap:1px;padding:9px 12px;border-radius:14px;background:var(--surface-2);border:1px solid var(--line);text-align:left;transition:transform .12s,border-color .2s}
.qchip:active{transform:scale(.96);border-color:var(--accent)}
.qchip b{font-size:.84rem;font-weight:600;white-space:nowrap}
.qchip small{font-size:.72rem;color:var(--muted)}
.xlist{margin-top:12px}
.xrow{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line)}
.xrow:first-child{border-top:0}
.xrow .nm{flex:1;min-width:0}
.xrow .nm b{display:block;font-size:.9rem;font-weight:600}
.xrow .nm small{color:var(--muted);font-size:.76rem}
.qty{display:flex;align-items:center;gap:2px;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:2px}
.qty button{width:28px;height:28px;border-radius:8px;font-weight:700}
.qty span{min-width:26px;text-align:center;font-size:.82rem;font-weight:700;font-variant-numeric:tabular-nums}
details.more{margin-top:12px}
details.more summary{cursor:pointer;list-style:none;font-size:.86rem;font-weight:600;color:var(--accent);display:inline-flex;align-items:center;gap:6px}
details.more summary::-webkit-details-marker{display:none}
.xgrid{display:grid;grid-template-columns:2fr 1fr 1fr .8fr;gap:8px;margin-top:10px}
@media (max-width:460px){.xgrid{grid-template-columns:1fr 1fr 1fr}.xgrid .field:first-child{grid-column:1/-1}}

.glasses{display:flex;flex-wrap:wrap;gap:6px}
.glass{width:28px;height:38px;border-radius:5px 5px 10px 10px;border:2px solid var(--line-2);position:relative;overflow:hidden;transition:border-color .3s}
.glass::after{content:"";position:absolute;left:0;right:0;bottom:0;height:0;background:linear-gradient(180deg,#7CC4FF,var(--blue));transition:height .35s cubic-bezier(.2,.8,.2,1)}
.glass.on{border-color:var(--blue)}
.glass.on::after{height:100%}
.grid2{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media (min-width:560px){.grid2{grid-template-columns:repeat(4,1fr)}}

/* ---------- progress ---------- */
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media (min-width:560px){.tiles{grid-template-columns:repeat(3,1fr)}}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px;box-shadow:var(--shadow)}
.tile b{display:block;font:700 1.6rem var(--display);letter-spacing:-.02em;font-variant-numeric:tabular-nums;margin-top:4px}
.tile small{font-size:.76rem;color:var(--muted)}
.tile .up{color:var(--warn)}.tile .down{color:var(--good)}
.chart svg{width:100%;height:auto;display:block}
.chart .axis{stroke:var(--line);stroke-width:1}
.chart .lbl{fill:var(--muted);font:11px var(--body)}
.chart .area{fill:url(#wg);opacity:.9}
.chart .ln{fill:none;stroke:var(--accent);stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}
.chart .avg{fill:none;stroke:var(--fg);stroke-width:1.5;stroke-dasharray:4 4;opacity:.45}
.chart .pt{fill:var(--surface);stroke:var(--accent);stroke-width:2}
.days{display:flex;flex-direction:column}
.dayrow{display:grid;grid-template-columns:1fr auto auto auto;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line);font-size:.86rem}
.dayrow:first-child{border-top:0}
.dayrow .d b{display:block;font-weight:600}
.dayrow .d small{color:var(--muted);font-size:.76rem}
.dayrow .m{font-variant-numeric:tabular-nums;color:var(--muted);text-align:right;min-width:44px}
.badge{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--surface-2);color:var(--faint);font-size:.8rem}
.badge.on{background:var(--good);color:#06240F}

/* ---------- plan ---------- */
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.wd{border-radius:14px;padding:10px 4px;text-align:center;background:var(--surface);border:1px solid var(--line);min-width:0}
.wd span{display:block;font-size:.68rem;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.06em}
.wd b{display:block;font:700 .82rem var(--display);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wd.rest{background:transparent;border-style:dashed}
.wd.today{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset;background:var(--accent-soft)}
details.acc{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}
details.acc + details.acc,.card + details.acc,details.acc + .card{margin-top:12px}
details.acc > summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:12px;padding:16px 18px}
details.acc > summary::-webkit-details-marker{display:none}
details.acc > summary .sp small{display:block;color:var(--muted);font-size:.8rem;margin-top:2px}
details.acc[open] > summary .chev{transform:rotate(180deg)}
details.acc .acc-body{padding:0 18px 18px}
ul.plain{margin:0;padding-left:18px}ul.plain li{margin:6px 0}
table{border-collapse:collapse;width:100%;font-size:.88rem}
th,td{text-align:left;padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:.7rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
td.n{font-variant-numeric:tabular-nums;white-space:nowrap}
tr:last-child td{border-bottom:0}
.tablewrap{overflow-x:auto}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.kpi{background:var(--surface-2);border-radius:14px;padding:10px;text-align:center}
.kpi b{display:block;font:700 1.15rem var(--display);font-variant-numeric:tabular-nums}
.kpi small{font-size:.68rem;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:600}
.sub{margin:22px 0 10px;font-size:.78rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}

/* ---------- profile ---------- */
.form{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.form .wide{grid-column:1/-1}
@media (min-width:560px){.form{grid-template-columns:repeat(3,1fr)}}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg label{margin:0;border:1px solid var(--line);background:var(--surface-2);border-radius:11px;padding:9px 13px;cursor:pointer;font-size:.86rem;font-weight:500;text-transform:none;letter-spacing:0;color:var(--fg);transition:all .2s}
.seg input:checked + label{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.seg input:focus-visible + label{outline:2px solid var(--accent);outline-offset:2px}
.hpair{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.msg{font-size:.8rem;color:var(--muted);min-height:1em}
.msg.ok{color:var(--good)}.msg.err{color:var(--warn)}

/* ---------- welcome ---------- */
.welcome{text-align:left;padding:28px 22px;background:linear-gradient(160deg,color-mix(in srgb,var(--accent) 22%,var(--surface)),var(--surface) 60%)}
.welcome h1{margin:6px 0 10px}

/* ---------- rest timer & toast ---------- */
.timer{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translate(-50%,140%);z-index:40;display:flex;align-items:center;gap:12px;padding:10px 10px 10px 12px;border-radius:22px;background:color-mix(in srgb,var(--surface) 88%,transparent);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid var(--line-2);box-shadow:0 20px 50px rgba(0,0,0,.45);width:min(440px,calc(100% - 24px));transition:transform .4s cubic-bezier(.2,.8,.2,1)}
.timer.show{transform:translate(-50%,0)}
.timer.ding{animation:ding .5s 2}
@keyframes ding{50%{box-shadow:0 0 0 6px var(--good-soft),0 20px 50px rgba(0,0,0,.45)}}
.tm-ring{width:52px;height:52px;flex:none;position:relative}
.tm-ring svg{width:52px;height:52px;transform:rotate(-90deg)}
.tm-ring .trk{fill:none;stroke:var(--surface-2);stroke-width:5}
.tm-ring .val{fill:none;stroke:var(--accent);stroke-width:5;stroke-linecap:round;transition:stroke-dashoffset .25s linear}
.tm-info{flex:1;min-width:0}
.tm-info b{display:block;font:800 1.45rem var(--display);font-variant-numeric:tabular-nums;letter-spacing:-.02em;line-height:1}
.tm-info small{display:block;color:var(--muted);font-size:.74rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:3px}
.timer .btn.sm{padding:0 10px}
.toast{position:fixed;left:50%;top:calc(120px + env(safe-area-inset-top,0px));transform:translate(-50%,-20px);opacity:0;z-index:45;background:var(--fg);color:var(--bg);padding:10px 14px;border-radius:14px;font-size:.86rem;font-weight:600;display:flex;gap:12px;align-items:center;transition:all .3s;pointer-events:none;max-width:calc(100% - 32px)}
.toast.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.toast button{color:var(--accent);font-weight:700}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}html{scroll-behavior:auto}}
footer{margin-top:36px;text-align:center;color:var(--faint);font-size:.75rem}
</style>
</head>
<body>
<header class="top">
<div class="top-in">
<div class="row" style="flex-wrap:nowrap">
<div class="brand sp"><div class="logo" id="logo">N</div><div style="min-width:0"><b id="hello">Night Shift Physique</b><small id="who">Your gym and diet log</small></div></div>
<span id="status" class="status">Connecting…</span>
</div>
<nav class="pills" id="pills" aria-label="Sections">
<button class="pill" data-go="today" aria-current="true">Today</button>
<button class="pill" data-go="workout">Workout</button>
<button class="pill" data-go="meals">Meals</button>
<button class="pill" data-go="progress">Progress</button>
<button class="pill" data-go="plan">Plan</button>
<button class="pill" data-go="me">Profile</button>
</nav>
</div>
</header>

<div class="wrap">
<main>
<section class="sec hero" id="s-today"></section>
<section class="sec" id="s-workout"></section>
<section class="sec" id="s-meals"></section>
<section class="sec" id="s-progress"></section>
<section class="sec" id="s-plan"></section>
<section class="sec" id="s-me"></section>
</main>
<footer>Night Shift Physique · desi diet, no supplements</footer>
</div>

<div class="timer" id="timer" role="timer" aria-live="polite">
<div class="tm-ring"><svg viewBox="0 0 52 52"><circle class="trk" cx="26" cy="26" r="22"/><circle class="val" id="tmRing" cx="26" cy="26" r="22" stroke-dasharray="138.2" stroke-dashoffset="0"/></svg></div>
<div class="tm-info"><b id="tmTxt">1:30</b><small id="tmNext">Rest</small></div>
<button class="btn sm" data-tm="-15" type="button">−15</button>
<button class="btn sm" data-tm="15" type="button">+15</button>
<button class="btn sm primary" data-tm="skip" type="button">Skip</button>
</div>
<div class="toast" id="toast" role="status"><span id="toastTxt"></span><button id="toastUndo" type="button" hidden>Undo</button></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
/* ================= EXERCISE LIBRARY ================= */
const X={
bench:{n:"Flat bench press (barbell or dumbbell)",s:4,r:"6–10",tip:"Shoulder blades pinned back, bar to lower chest."},
incdb:{n:"Incline dumbbell press",s:3,r:"8–12",tip:"Bench at 30°. Builds the upper chest."},
ohp:{n:"Seated dumbbell shoulder press",s:3,r:"8–12",tip:"Stop just short of lockout."},
lat:{n:"Dumbbell lateral raise",s:4,r:"12–15",tip:"Light weight, slow lowering."},
push:{n:"Rope triceps pushdown",s:3,r:"10–15",tip:"Elbows glued to sides."},
ohtri:{n:"Overhead dumbbell triceps extension",s:2,r:"10–15",tip:""},
pd:{n:"Lat pulldown (or assisted pull-up)",s:4,r:"6–10",tip:"Pull elbows down to your back pockets."},
crow:{n:"Seated cable row",s:3,r:"8–12",tip:"Chest up, squeeze 1 second."},
dbrow:{n:"One-arm dumbbell row",s:3,r:"10–12",tip:"Per arm. Flat back."},
face:{n:"Face pull",s:3,r:"15",tip:"Rope to forehead. Good for posture after desk hours."},
curl:{n:"Dumbbell biceps curl",s:3,r:"10–12",tip:"No swinging."},
ham:{n:"Hammer curl",s:2,r:"10–12",tip:""},
squat:{n:"Back squat (or leg press if back is stiff)",s:4,r:"6–10",tip:"Depth over weight."},
rdl:{n:"Romanian deadlift",s:3,r:"8–10",tip:"Hips back, bar close to legs."},
lp:{n:"Leg press",s:3,r:"10–12",tip:""},
lcurl:{n:"Lying or seated leg curl",s:3,r:"10–15",tip:""},
calf:{n:"Standing calf raise",s:4,r:"12–15",tip:"Pause 2 seconds at the bottom."},
plank:{n:"Plank (seconds)",s:3,r:"40s",tip:"Log seconds held in the reps box."},
incbb:{n:"Incline barbell or Smith press",s:3,r:"6–10",tip:""},
csrow:{n:"Chest-supported or machine row",s:3,r:"8–12",tip:""},
pd2:{n:"Close-grip pulldown",s:3,r:"8–12",tip:""},
ss:{n:"Curl + pushdown superset",s:3,r:"12 + 12",tip:"Back to back, rest after both."},
dl:{n:"Deadlift (or trap-bar deadlift)",s:3,r:"5",tip:"Keep it light until form is solid."},
bss:{n:"Bulgarian split squat",s:3,r:"8–10",tip:"Per leg."},
lext:{n:"Leg extension",s:3,r:"12–15",tip:""},
scalf:{n:"Seated calf raise",s:3,r:"15",tip:""},
hkr:{n:"Hanging knee raise",s:3,r:"12",tip:"Slow, no swinging."},
hip:{n:"Barbell or machine hip thrust",s:3,r:"8–12",tip:"Squeeze glutes 1 second at the top."}
};
const BIG=new Set(["bench","squat","dl","pd","incbb","rdl","hip","bss"]);
const DAYS={
push:{name:"Push",focus:"Chest · Shoulders · Triceps",ex:["bench","incdb","ohp","lat","push","ohtri"]},
pull:{name:"Pull",focus:"Back · Biceps · Rear delts",ex:["pd","crow","dbrow","face","curl","ham"]},
legs:{name:"Legs",focus:"Quads · Hamstrings · Calves · Core",ex:["squat","rdl","lp","lcurl","calf","plank"]},
upper:{name:"Upper",focus:"Chest · Back · Shoulders · Arms",ex:["incbb","csrow","ohp","pd2","lat","ss"]},
lower:{name:"Lower",focus:"Posterior chain · Core",ex:["dl","bss","lext","lcurl","scalf","hkr"]},
fullA:{name:"Full body A",focus:"Squat · Bench · Pulldown",ex:["squat","bench","pd","rdl","lat","plank"]},
fullB:{name:"Full body B",focus:"Deadlift · Incline · Row",ex:["dl","incdb","crow","lp","curl","push"]},
fullC:{name:"Full body C",focus:"Split squat · Press · Row",ex:["bss","ohp","dbrow","lcurl","face","hkr"]},
rest:{name:"Rest",focus:"Recovery · walk · stretch",ex:[]}
};
const SPLITS={ // index 0 = Sunday
3:["rest","fullA","rest","fullB","rest","fullC","rest"],
4:["rest","upper","lower","rest","upper","lower","rest"],
5:["rest","push","pull","legs","rest","upper","lower"],
6:["rest","push","pull","legs","push","pull","legs"]
};
const WEEKNAMES=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];

/* ================= STATE ================= */
let logs={}, settings={start:null,profile:null};
let coll=null, mode="local";
let viewDate=null;
const P=()=>settings.profile;

/* ================= DATES ================= */
function pad(n){return String(n).padStart(2,"0")}
function ymd(d){return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())}
function logicalDate(d){return ymd(d)} // the day changes at midnight, following the phone's clock
function parse(s){const [y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d)}
function addDays(s,n){const d=parse(s);d.setDate(d.getDate()+n);return ymd(d)}
function fmtDate(s){return parse(s).toLocaleDateString("en-GB",{weekday:"long",day:"numeric",month:"short"})}
function esc(s){return String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
function toMin(t){const [h,m]=(t||"0:0").split(":").map(Number);return (h||0)*60+(m||0)}
function fmt12(m){m=((Math.round(m/15)*15)%1440+1440)%1440;let h=Math.floor(m/60),mm=m%60;const ap=h<12?"AM":"PM";h=h%12||12;return h+":"+pad(mm)+" "+ap}

/* ================= THE CALCULATOR ================= */
function compute(p){
const h=p.cm/100, bmiW=25*h*h, basis=Math.min(p.weight,Math.max(bmiW,p.weight*0.8));
const bmr=10*p.weight+6.25*p.cm-5*p.age+(p.sex==="female"?-161:5);
const act={desk:1.2,moderate:1.35,active:1.5}[p.activity]||1.2;
const tdee=bmr*(act+p.days*0.035);
const adj={lose:0.85,recomp:0.93,build:1.1}[p.goal];
let kcal=Math.round(tdee*adj/50)*50;
kcal=Math.max(kcal,p.sex==="female"?1400:1700);
const prot=Math.round(basis*(p.goal==="lose"?2.0:1.8)/5)*5;
const fatPct=p.body==="heavier"?0.30:p.body==="lean"?0.22:0.25;
const fat=Math.round(kcal*fatPct/9), carbs=Math.max(0,Math.round((kcal-prot*4-fat*9)/4));
const water=Math.min(16,Math.max(8,Math.round(p.weight*0.035/0.25)));
const steps=p.goal==="lose"?9000:p.goal==="recomp"?8000:7000;
const cardio={lose:"20 min incline walk (incline 8–10, 5 km/h)",recomp:"15 min incline walk",build:"10 min easy walk to cool down"}[p.goal];
const cardioMin={lose:20,recomp:15,build:10}[p.goal]||15;
const week=SPLITS[p.days]||SPLITS[5];
return {bmr:Math.round(bmr),tdee:Math.round(tdee),kcal,prot,fat,carbs,water,steps,cardio,cardioMin,week,meals:meals(p,kcal,prot)};
}
function dayEx(key,p){
const ids=[...DAYS[key].ex];
if(p&&p.sex==="female"&&["legs","lower","fullB"].includes(key)) ids.splice(1,0,"hip");
return ids.map(id=>Object.assign({id},X[id]));
}

/* ---- meal timing: anchored on wake, gym and sleep ---- */
function mealTimes(p){
const W=toMin(p.wake), rel=t=>(toMin(t)-W+1440)%1440;
const S=rel(p.sleep)||1020, G=rel(p.gym), GE=G+90;
const pre=Math.max(10,G-75), post=Math.min(GE+20,S-30);
const fixed=[{t:pre,type:"pre"},{t:post,type:"post"}];
if(pre-30>=90) fixed.push({t:30,type:"eggs"});
if(S-post>=180) fixed.push({t:S-90,type:"bed"});
fixed.sort((a,b)=>a.t-b.t);
const first=30,last=S-60,ft=fixed.map(s=>s.t),iv=[];
if(ft[0]-first>0) iv.push({a:first,b:ft[0],open:"start",k:0});
for(let i=1;i<ft.length;i++) iv.push({a:ft[i-1],b:ft[i],open:"",k:0});
if(last-ft[ft.length-1]>0) iv.push({a:ft[ft.length-1],b:last,open:"end",k:0});
const sp=(v,k)=>(v.b-v.a)/(v.open?k:k+1);
for(let n=fixed.length;n<5;n++){let best=null,bv=-1;for(const v of iv){const x=sp(v,v.k+1);if(x>bv){bv=x;best=v}}if(!best)break;best.k++}
const free=[];
for(const v of iv)for(let j=1;j<=v.k;j++){const step=sp(v,v.k);free.push({t:v.open==="start"?v.a+step*(j-1):v.a+step*j,type:null})}
const all=[...fixed,...free].sort((a,b)=>a.t-b.t);
const want=["eggs","main","bed"].filter(t=>!fixed.some(s=>s.type===t));
const open=all.filter(s=>!s.type);
if(want.includes("main")&&open.length){const d=s=>{const x=Math.abs(((W+s.t)%1440)-840);return Math.min(x,1440-x)};open.reduce((a,b)=>d(b)<d(a)?b:a).type="main"}
const rest=want.filter(t=>t!=="main");all.filter(s=>!s.type).forEach((s,i)=>s.type=rest[i]||"main");
return all.map(s=>({rel:s.t,clock:fmt12(W+s.t),abs:((W+s.t)%1440),type:s.type==="bed"?"snack":s.type}));
}
const bowls=n=>n+(n===1?" bowl":" bowls");
const half=x=>Math.max(0.5,Math.round(x*2)/2);
const r25=x=>Math.round(x/25)*25;
function chap(n){const w=Math.floor(n),f=n-w>0;return (w?w:"")+(f?"½":"")+" chapati"}
function meals(p,kcal,prot){
const f=kcal/2220, pf=prot/158, d=p.diet;
const meat=Math.min(250,Math.max(100,r25(150*pf))), eggsN=d==="nonveg"?Math.min(4,Math.max(2,Math.round(3*pf))):Math.min(5,Math.max(3,Math.round(4*pf)));
const dahi=Math.min(400,Math.max(150,r25(250*f))), rice=half(1*f);
const C={
eggs:{name:"Breakfast",base:[470,d==="egg"?34:31],items:
d==="veg"?`2 besan chilla (1 tsp oil) stuffed with ${r25(60*pf)} g paneer, 1 glass milk`
:`${eggsN} whole eggs + 2 egg whites as bhurji or omelette (1 tsp oil), ${chap(half(f))}, kheera-tamatar, 1 cup doodh patti (max 1 tsp sugar)`},
main:{name:"Lunch",base:[700,d==="nonveg"?58:36],items:
d==="nonveg"?`Chicken salan, ${meat} g boneless, ${chap(half(2*f))}, big salad, small bowl raita (1 tbsp oil for the whole portion)`
:d==="egg"?`${bowls(half(1.5*f))} daal or chana, ${chap(half(2*f))}, 3 boiled eggs, raita, salad`
:`${bowls(half(1.5*f))} daal or chana, ${chap(half(2*f))}, ${dahi} g raita, salad`},
pre:{name:"Natural pre-workout",base:[200,2],items:`${f>1.2?"2 bananas":"1 banana"} + 3 khajoor + 1 cup black coffee. Nimbu pani with a pinch of namak in your gym bottle.`},
post:{name:"Post-workout meal",base:[500,d==="nonveg"?49:34],items:
d==="nonveg"?`${meat} g grilled / tikka / handi chicken or fish, ${rice} cup boiled rice or ${chap(half(2*f))}, salad`
:d==="egg"?`${Math.min(6,eggsN+1)}-egg anda curry or bhurji, ${rice} cup rice or ${chap(half(2*f))}, salad`
:`Soya chunk or paneer salan (${r25(50*pf)} g dry soya or ${r25(120*pf)} g paneer), ${rice} cup rice, salad`},
snack:{name:"Dahi snack",base:[350,18],items:`${dahi} g dahi (or 1 glass milk) + 10 badaam + ½ cup boiled kala chana`}
};
return mealTimes(p).map((t,i)=>{const c=C[t.type],h=t.abs/60;let name=c.name;if(t.type==="eggs"&&!(h>=4&&h<13))name=d==="veg"?"Chilla meal":"Egg meal";if(t.type==="main"&&!(h>=11&&h<17))name="Main meal";return {id:"m"+(i+1),t:t.clock,name,items:c.items,kcal:Math.round(c.base[0]*f/10)*10,p:Math.round(c.base[1]*pf)}});
}

/* ================= STORAGE ================= */
const LKEY="nsp-logs-v1";
function loadLocal(){try{const j=JSON.parse(localStorage.getItem(LKEY)||"{}");return j&&typeof j==="object"?j:{}}catch(e){return {}}}
function saveLocal(){try{localStorage.setItem(LKEY,JSON.stringify({logs,settings}))}catch(e){}}
function setStatus(t,cls){const el=document.getElementById("status");el.textContent=t;el.className="status "+(cls||"")}
const pending=new Set();let timer=null,flushing=false;
let progT=null;
function queueSave(k){pending.add(k);saveLocal();setStatus("Saving…");clearTimeout(timer);timer=setTimeout(flush,700);clearTimeout(progT);progT=setTimeout(()=>{try{renderProgress()}catch(_){}},900)}
async function flush(){
if(flushing){timer=setTimeout(flush,400);return}
flushing=true;const keys=[...pending];pending.clear();let failed=false;
for(const k of keys){
if(!coll)continue;
const body=JSON.parse(JSON.stringify(k==="settings"?settings:logs[k]));
try{await coll.doc(k).set(body)}catch(e){
if(e&&e.code==="unavailable"){await new Promise(r=>setTimeout(r,800+Math.random()*800));try{await coll.doc(k).set(body);continue}catch(_){}}
failed=true}
}
flushing=false;
if(failed&&!coll) setStatus("On this device","ok");
else if(failed) setStatus("Offline · saved here","err");
else setStatus(mode==="cloud"?"Synced":"On this device","ok");
}

/* ================= SUPABASE SYNC (schema: fitness) ================= */
const SB_URL="https://nmbmtdeoceprhsorlenq.supabase.co",SB_KEY="sb_publishable_sredBn5j6gFF8LLRP2qVmw_eeVUrwPG";
let sb=null,sbUser=null;
function sbClient(){if(!sb&&window.supabase&&window.supabase.createClient){try{sb=window.supabase.createClient(SB_URL,SB_KEY,{auth:{persistSession:true,autoRefreshToken:true,storageKey:"nsp-auth"}})}catch(e){sb=null}}return sb}
async function sbColl(){const c=sbClient();if(!c)return null;const {data}=await c.auth.getSession();sbUser=data&&data.session?data.session.user:null;if(!sbUser)return null;
return{doc:k=>({set:async body=>{const {error}=await c.rpc("fitness_set",{p_key:k,p_data:body});if(error)throw Object.assign(new Error(error.message),{code:"unavailable"})}}),
get:async()=>{const {data,error}=await c.rpc("fitness_get");if(error)throw error;return{docs:(data||[]).map(r=>({id:r.k,exists:true,data:()=>r.data}))}}}}

let initing=false;
async function init(){
if(initing)return;initing=true;
try{
const local=loadLocal();logs=local.logs||{};settings=Object.assign({start:null,profile:null},local.settings||{});
viewDate=viewDate||logicalDate(new Date());renderAll();
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(_){}
try{
coll=await sbColl();
if(!coll){mode="local";setStatus("On this device");renderMe();return}
mode="cloud";
const snap=await coll.get();const remote={};let rs=null;
snap.docs.forEach(d=>{if(!d.exists)return;if(d.id==="settings")rs=JSON.parse(JSON.stringify(d.data()));else remote[d.id]=JSON.parse(JSON.stringify(d.data()))});
for(const k of Object.keys(logs)) if(!remote[k]) pending.add(k);
logs=Object.assign({},logs,remote);
if(rs){settings=Object.assign({start:null,profile:null},rs,{profile:rs.profile||settings.profile});if(!rs.profile&&settings.profile)pending.add("settings")}
else if(settings.profile||settings.start) pending.add("settings");
saveLocal();renderAll();
if(!local.settings?.profile&&P()) goSec("today");
if(pending.size) flush(); else setStatus("Synced","ok");
}catch(e){setStatus("On this device")}

function getLog(date){
if(!logs[date]) logs[date]={date,dayKey:(P()?compute(P()).week:SPLITS[5])[parse(date).getDay()],meals:{},ex:{},water:0};
if(!DAYS[logs[date].dayKey]) logs[date].dayKey="rest";
if(!logs[date].ex) logs[date].ex={};
if(!logs[date].meals) logs[date].meals={};
return logs[date];
}
function weekNo(date){const s=settings.start||date;return Math.max(1,Math.floor((parse(date)-parse(s))/864e5/7)+1)}
function easeIn(date){const p=P();return p&&p.exp!=="regular"&&weekNo(date)<=2}
function setsFor(ex,date){return easeIn(date)?Math.min(ex.s,2):ex.s}
function lastFor(id,before){
const ds=Object.keys(logs).filter(d=>d<before&&logs[d].ex&&logs[d].ex[id]).sort().reverse();
for(const d of ds){const e=logs[d].ex[id];const reps=(e.r||[]).filter(x=>x!==""&&x!=null);if(e.w||reps.length)return `${e.w||"–"} kg × ${reps.join(", ")||"–"}`}

}

function renderProgress(){

const p=P(),today=logicalDate(new Date());
const last7=[...Array(7)].map((_,i)=>addDays(today,-i)),prev7=[...Array(7)].map((_,i)=>addDays(today,-7-i));
const avg=ds=>{const v=ds.map(d=>parseFloat(logs[d]?.weight)).filter(x=>!isNaN(x));return v.length?v.reduce((a,b)=>a+b,0)/v.length:null};
const a1=avg(last7),a0=avg(prev7),delta=a1!=null&&a0!=null?a1-a0:null;
const workouts=last7.filter(d=>logs[d]?.done&&logs[d].dayKey!=="rest").length;
const nMeals=compute(p).meals.length;
const mealsHit=last7.reduce((a,d)=>a+Object.values(logs[d]?.meals||{}).filter(Boolean).length,0);
const waists=Object.keys(logs).filter(d=>logs[d].waist).sort(),w=waists.length?logs[waists[waists.length-1]].waist:null;
const active=d=>{const L=logs[d];return !!(L&&(L.done||Object.values(L.meals||{}).some(Boolean)))};
let streak=0,sd=active(today)?today:addDays(today,-1);while(active(sd)&&streak<1000){streak++;sd=addDays(sd,-1)}
const vol=last7.reduce((a,d)=>{const L=logs[d];if(!L||!L.ex)return a;return a+Object.values(L.ex).reduce((s,e)=>s+(e.d||[]).filter(Boolean).length,0)},0);
el.innerHTML=`<div class="sec-head"><div><div class="eyebrow">Week ${weekNo(today)} · last 7 days</div><h2>Progress</h2></div></div>
<div class="tiles">
<div class="tile"><span class="eyebrow">Avg weight</span><b>${a1!=null?a1.toFixed(1):"–"}</b><small>${delta!=null?`<span class="${delta<=0?"down":"up"}">${delta<=0?"▼":"▲"} ${Math.abs(delta).toFixed(1)} kg</span> vs last week`:"kg, 7-day average"}</small></div>
<div class="tile"><span class="eyebrow">Workouts</span><b>${workouts}<span class="muted" style="font-size:1rem">/${p.days}</span></b><small>sessions finished</small></div>
<div class="tile"><span class="eyebrow">Sets done</span><b>${vol}</b><small>ticked this week</small></div>
<div class="tile"><span class="eyebrow">Meals on plan</span><b>${mealsHit}<span class="muted" style="font-size:1rem">/${nMeals*7}</span></b><small>this week</small></div>
<div class="tile"><span class="eyebrow">Streak</span><b>${streak}<span class="muted" style="font-size:1rem"> d</span></b><small>days logged in a row</small></div>
<div class="tile"><span class="eyebrow">Waist</span><b>${w?esc(w)+"″":"–"}</b><small>latest weekly check</small></div></div>
<div class="card chart" style="margin-top:12px"><div class="row" style="margin-bottom:10px"><h3 class="sp">Body weight</h3><span class="eyebrow">Line: daily · dashed: 7-day avg</span></div>${weightChart()}</div>
<div class="card"><h3 style="margin-bottom:6px">Recent days</h3>${recentList(nMeals)}</div>`;
}
function weightChart(){
const ds=Object.keys(logs).filter(d=>!isNaN(parseFloat(logs[d].weight))).sort().slice(-60);
if(ds.length<2)return `<p class="muted" style="font-size:.9rem">Log your weight in Meals → Body and recovery each morning. The chart appears after two entries.</p>`;
const vals=ds.map(d=>parseFloat(logs[d].weight));const lo=Math.floor(Math.min(...vals)-1),hi=Math.ceil(Math.max(...vals)+1);
const W=620,H=230,L=40,R=10,T=12,B=28,t0=parse(ds[0]).getTime(),t1=parse(ds[ds.length-1]).getTime();
const x=d=>L+(parse(d).getTime()-t0)/Math.max(1,t1-t0)*(W-L-R),y=v=>T+(hi-v)/(hi-lo)*(H-T-B);
const line=ds.map((d,i)=>(i?"L":"M")+x(d).toFixed(1)+","+y(vals[i]).toFixed(1)).join("");
const area=line+`L${x(ds[ds.length-1]).toFixed(1)},${H-B}L${x(ds[0]).toFixed(1)},${H-B}Z`;
const avgP=ds.map((d,i)=>{const win=ds.filter(e=>e<=d&&e>addDays(d,-7)).map(e=>parseFloat(logs[e].weight));return (i?"L":"M")+x(d).toFixed(1)+","+y(win.reduce((a,b)=>a+b,0)/win.length).toFixed(1)}).join("");
const short=d=>parse(d).toLocaleDateString("en-GB",{day:"numeric",month:"short"});
return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Body weight over time"><defs><linearGradient id="wg" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="var(--accent)" stop-opacity=".28"/><stop offset="1" stop-color="var(--accent)" stop-opacity="0"/></linearGradient></defs>
${[lo,(lo+hi)/2,hi].map(t=>`<line class="axis" x1="${L}" x2="${W-R}" y1="${y(t)}" y2="${y(t)}"/><text class="lbl" x="${L-8}" y="${y(t)+4}" text-anchor="end">${t%1?t.toFixed(1):t}</text>`).join("")}
<path class="area" d="${area}"/><path class="avg" d="${avgP}"/><path class="ln" d="${line}"/>
${ds.map((d,i)=>`<circle class="pt" cx="${x(d)}" cy="${y(vals[i])}" r="3.5"/>`).join("")}
<text class="lbl" x="${L}" y="${H-6}">${short(ds[0])}</text><text class="lbl" x="${W-R}" y="${H-6}" text-anchor="end">${short(ds[ds.length-1])}</text></svg>`;
}
function recentList(nMeals){
const ds=Object.keys(logs).filter(d=>/^\d{4}-\d\d-\d\d$/.test(d)&&d<=logicalDate(new Date())).sort().reverse().slice(0,10);
if(!ds.length)return `<p class="muted" style="font-size:.9rem">Nothing logged yet. Tick a set or a meal and it shows up here.</p>`;
return `<div class="days">${ds.map(d=>{const L=logs[d],m=Object.values(L.meals||{}).filter(Boolean).length;
return `<div class="dayrow"><div class="d"><b>${parse(d).toLocaleDateString("en-GB",{weekday:"short",day:"numeric",month:"short"})}</b><small>${esc(DAYS[L.dayKey]?.name||"")}${L.weight?" · "+esc(L.weight)+" kg":""}</small></div><span class="m">${m}/${nMeals} meals</span><span class="m">${L.water||0} gl</span><span class="badge${L.done?" on":""}" title="${L.done?"Done":"Not done"}">${L.done?"✓":"·"}</span></div>`}).join("")}</div>`;
}

function readForm(){
const v=id=>document.getElementById(id).value.trim(),r=n=>(document.querySelector(`input[name="${n}"]:checked`)||{}).value;
const ft=parseFloat(v("f-ft"))||0,inch=parseFloat(v("f-in"))||0,cm=Math.round((ft*12+inch)*2.54);
const p={name:v("f-name"),sex:r("sex"),age:parseInt(v("f-age")),cm,weight:parseFloat(v("f-weight")),waist:v("f-waist"),body:r("body"),goal:r("goal"),exp:r("exp"),days:parseInt(r("days")),activity:r("activity"),diet:r("diet"),wake:v("f-wake"),gym:v("f-gym"),sleep:v("f-sleep")};
const errs=[];
if(!(p.age>=14&&p.age<=80))errs.push("age between 14 and 80");
if(!(cm>=135&&cm<=220))errs.push("height in feet and inches");
if(!(p.weight>=35&&p.weight<=200))errs.push("weight in kg");
if(!p.wake||!p.gym||!p.sleep)errs.push("wake, gym and sleep times");
return {p,errs};
}

/* ================= NAVIGATION ================= */
const SECS=["today","workout","meals","progress","plan","me"];
function goSec(name){const s=$("s-"+name);if(s&&!s.hidden){s.scrollIntoView({behavior:"smooth",block:"start"});setPill(name)}}
function setPill(name){document.querySelectorAll(".pill").forEach(b=>b.setAttribute("aria-current",b.dataset.go===name?"true":"false"))}
function updatePills(){document.querySelectorAll(".pill").forEach(b=>{const s=$("s-"+b.dataset.go);b.hidden=!!(s&&s.hidden)})}
let spyRaf=0;
addEventListener("scroll",()=>{cancelAnimationFrame(spyRaf);spyRaf=requestAnimationFrame(()=>{let cur="today";for(const n of SECS){const s=$("s-"+n);if(s&&!s.hidden&&s.getBoundingClientRect().top<=150)cur=n}
if(innerHeight+scrollY>=document.body.scrollHeight-4){const vis=SECS.filter(n=>!$("s-"+n).hidden);cur=vis[vis.length-1]}setPill(cur)})},{passive:true});

function renderDay(){renderHero();renderWorkout();renderMeals()}
function renderAll(){whoLine();renderDay();renderProgress();renderPlan();renderMe();updatePills()}

const go=e.target.closest("[data-go]");if(go){goSec(go.dataset.go);return}
const tm=e.target.closest("[data-tm]");
if(tm){const v=tm.dataset.tm;if(v==="skip"){stopRest();return}if(!RT.end)return;RT.end+=(+v)*1000;if(+v>0)RT.total+=+v;tickTimer();return}
if(e.target.closest("#toastUndo")){if(toastUndo){toastUndo();toastUndo=null}$("toast").classList.remove("show");return}
const b=e.target.closest("[data-act]");
if(b&&P()){
const act=b.dataset.act,L=getLog(viewDate),plan=compute(P());
switch(act){
case "prev":viewDate=addDays(viewDate,-1);stopRest();renderDay();return;
case "next":viewDate=addDays(viewDate,1);stopRest();renderDay();return;
case "today":viewDate=logicalDate(new Date());renderDay();return;
case "daykey":L.dayKey=b.dataset.k;haptic();queueSave(viewDate);renderDay();return;
case "exopen":{const k=viewDate+"|"+b.dataset.id,art=b.closest(".ex"),open=!art.classList.contains("open");ui.ex[k]=open;art.classList.toggle("open",open);b.setAttribute("aria-expanded",open);return}
case "tick":unlockAudio();tickSet(b.dataset.id,+b.dataset.i);return;
case "setplus":case "setminus":{const ex=dayEx(L.dayKey,P()).find(x=>x.id===b.dataset.id);if(!ex)return;const en=exRec(L,ex.id),n=exN(L,ex),m=Math.max(1,Math.min(10,n+(act==="setplus"?1:-1)));if(m===n)return;en.n=m;
if(m<n){en.r.length=Math.min(en.r.length,m);en.d.length=Math.min(en.d.length,m)}
ui.ex[viewDate+"|"+ex.id]=true;haptic();queueSave(viewDate);renderWorkout();updateRings();return}
case "cardio":{unlockAudio();const k=b.dataset.k,c=cardioOf(L,k);L[k]={m:c.m,done:!c.done};if(k==="ce")L.cardio=false;haptic(15);
if(!c.done&&k==="cs")toast("Warm-up done. Time to lift.");autoFinish(L);queueSave(viewDate);renderWorkout();updateRings();return}
case "finish":L.done=true;stopRest();haptic([30,60,30]);toast(DAYS[L.dayKey].ex.length?"Workout logged. Nice work.":"Recovery logged.");queueSave(viewDate);renderWorkout();updateRings();return;
case "unfinish":L.done=false;queueSave(viewDate);renderWorkout();updateRings();return;
case "mealopen":{const k=viewDate+"|"+b.dataset.id,m=b.closest(".meal"),open=!m.classList.contains("open");ui.meal[k]=open;m.classList.toggle("open",open);b.setAttribute("aria-expanded",open);return}
case "meal":{const id=b.dataset.id,on=!L.meals[id];L.meals[id]=on;ui.meal[viewDate+"|"+id]=!on;haptic(on?15:8);queueSave(viewDate);
const m=b.closest(".meal");m.classList.toggle("done",on);m.classList.toggle("open",!on);b.setAttribute("aria-pressed",on);if(on)b.classList.add("pop");else b.classList.remove("pop");
const ey=$("s-meals").querySelector(".sec-head .eyebrow");if(ey){const n=plan.meals.filter(x=>L.meals[x.id]).length;ey.textContent=`${n} of ${plan.meals.length} eaten · ~${plan.kcal.toLocaleString()} kcal · ${plan.prot} g protein`}
updateRings();return}
case "xquick":{const f=FOODS[+b.dataset.i];L.extra=L.extra||[];const ex=L.extra.find(x=>x.n===f[0]&&x.k===f[1]);if(ex)ex.q+=1;else L.extra.push({n:f[0],k:f[1],p:f[2],q:1});haptic(12);queueSave(viewDate);renderMeals();updateRings();
toast(`Added ${f[0].replace(/ \(.*\)$/,"")} · ${f[1]} kcal`,()=>{const L2=getLog(viewDate),x=(L2.extra||[]).find(x=>x.n===f[0]&&x.k===f[1]);if(x){if(x.q>1)x.q-=1;else L2.extra.splice(L2.extra.indexOf(x),1)}queueSave(viewDate);renderMeals();updateRings()});return}
case "xqp":{const x=(L.extra||[])[+b.dataset.i];if(!x)return;x.q+=1;queueSave(viewDate);renderMeals();updateRings();return}
case "xqm":{const i=+b.dataset.i,x=(L.extra||[])[i];if(!x)return;if(x.q>1)x.q-=1;else{const rm=L.extra.splice(i,1)[0];toast(`Removed ${rm.n.replace(/ \(.*\)$/,"")}`,()=>{const L2=getLog(viewDate);L2.extra=L2.extra||[];L2.extra.splice(i,0,rm);queueSave(viewDate);renderMeals();updateRings()})}
queueSave(viewDate);renderMeals();updateRings();return}
case "xadd":{const n=$("xn").value.trim(),k=+$("xk").value,pp=+$("xp").value||0,q=+$("xq").value||1;if(!n||!(k>0)){toast("Enter the food name and its calories");return}
L.extra=L.extra||[];L.extra.push({n,k,p:pp,q});queueSave(viewDate);renderMeals();updateRings();toast(`Added ${n}`);return}
case "glass":{const i=+b.dataset.i;L.water=(L.water||0)===i+1?i:i+1;haptic(8);queueSave(viewDate);refreshWater();return}
case "waterp":L.water=Math.min(plan.water+6,(L.water||0)+1);haptic(8);queueSave(viewDate);refreshWater();if(L.water===plan.water)toast("Water target hit");return;
case "waterm":L.water=Math.max(0,(L.water||0)-1);queueSave(viewDate);refreshWater();return;
}
}
/* account */
const ab=e.target.closest("#acIn,#acUp,#acOut,#acSync");
if(ab){const c=sbClient();if(!c)return;const msg=t=>{const m=$("acMsg");if(m)m.textContent=t};
if(ab.id==="acOut"){await c.auth.signOut();sbUser=null;coll=null;mode="local";setStatus("On this device");renderMe();return}
if(ab.id==="acSync"){msg("Syncing…");await init();toast("Synced");return}
const email=($("acEmail").value||"").trim(),password=$("acPass").value||"";
if(!email||password.length<6){msg("Enter your email and a password of at least 6 characters.");return}
ab.disabled=true;msg(ab.id==="acIn"?"Signing in…":"Creating account…");
try{if(ab.id==="acIn"){const {error}=await c.auth.signInWithPassword({email,password});if(error)throw error}
else{const {data,error}=await c.auth.signUp({email,password,options:{emailRedirectTo:location.origin+location.pathname}});if(error)throw error;
if(!data.session){msg("Account created. Check your email to confirm it, then sign in here.");ab.disabled=false;return}}
await init();toast("Signed in. Your logs now sync.")}catch(err){msg((err&&err.message)||"Something went wrong");ab.disabled=false}
return}
/* backup */
if(e.target.closest("#copyBk")){
const code=btoa(unescape(encodeURIComponent(JSON.stringify({logs,settings}))));const m=$("bkMsg");
try{await navigator.clipboard.writeText(code);m.textContent="Copied. Keep it in WhatsApp or Notes.";m.className="msg ok"}
catch(_){const ta=$("bkIn");ta.value=code;ta.select();m.textContent="Selected in the box below. Copy it from there.";m.className="msg"}
return}
const rb=e.target.closest("#restoreBk");
if(rb){const m=$("bkMsg");
if(!restoreArmed){restoreArmed=true;rb.textContent="Tap again to replace all data";setTimeout(()=>{restoreArmed=false;if(rb.isConnected)rb.textContent="Restore and replace my data"},5000);return}
restoreArmed=false;
try{const j=JSON.parse(decodeURIComponent(escape(atob($("bkIn").value.trim()))));if(!j||typeof j.logs!=="object")throw 0;
logs=j.logs;settings=Object.assign({start:null,profile:null},j.settings||{});
Object.keys(logs).forEach(k=>pending.add(k));queueSave("settings");viewDate=logicalDate(new Date());renderAll();goSec("today");toast("Data restored");
}catch(_){rb.textContent="Restore and replace my data";m.textContent="That code didn't work. Copy the whole code and try again.";m.className="msg err"}}
});
let restoreArmed=false;

document.addEventListener("input",e=>{
const t=e.target;if(!P())return;
if(t.dataset.ex){const L=getLog(viewDate),en=exRec(L,t.dataset.ex);if(t.dataset.k==="w")en.w=t.value;else en.r[+t.dataset.i]=t.value;queueSave(viewDate)}
else if(t.dataset.cardio){const L=getLog(viewDate),k=t.dataset.cardio,c=cardioOf(L,k);L[k]={m:t.value,done:c.done};if(k==="ce")L.cardio=false;queueSave(viewDate)}
else if(t.dataset.f){const L=getLog(viewDate);L[t.dataset.f]=t.value;queueSave(viewDate)}
});

document.addEventListener("submit",e=>{
if(e.target.id!=="pform")return;e.preventDefault();
const {p,errs}=readForm(),err=$("ferr");
if(errs.length){err.hidden=false;err.textContent="Please add your "+errs.join(", ")+".";return}
const first=!P();settings.profile=p;if(!settings.start)settings.start=logicalDate(new Date());
const td=logicalDate(new Date());if(logs[td]&&!Object.keys(logs[td].ex||{}).length&&!logs[td].done)logs[td].dayKey=compute(p).week[parse(td).getDay()];
viewDate=td;queueSave("settings");renderAll();
if(first){setTimeout(()=>goSec("today"),50);toast("Your plan is ready")}else toast("Plan updated");
});

document.addEventListener("visibilitychange",()=>{
if(document.visibilityState!=="visible")return;
if(RT.end)tickTimer();
if(mode==="cloud"&&!pending.size&&!flushing)init();
});

init();
</script>

// Native app: keep content clear of the Android status bar.
(function(){var C=window.Capacitor;if(!C||!C.getPlatform||C.getPlatform()!=="android")return;
var pr=document.createElement("div");pr.style.cssText="position:fixed;top:0;height:env(safe-area-inset-top,0px)";document.body.appendChild(pr);
if(pr.offsetHeight<1){var t=document.querySelector(".top");if(t)t.style.paddingTop="28px";document.querySelectorAll("section.sec").forEach(function(s){s.style.scrollMarginTop="146px"})}pr.remove()})();
</script>
