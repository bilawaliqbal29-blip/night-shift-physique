name: Build Android and iOS apps

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Put app files into www and assets folders
        run: |
          mkdir -p www assets
          for f in index.html manifest.webmanifest sw.js icon-192.png icon-512.png; do
            if [ -f "$f" ] && [ ! -f "www/$f" ]; then cp "$f" www/; fi
          done
          for f in icon-only.png icon-foreground.png icon-background.png splash.png splash-dark.png; do
            if [ -f "$f" ] && [ ! -f "assets/$f" ]; then cp "$f" assets/; fi
          done
          ls -la www assets

      - name: Install packages
        run: npm install

      - name: Create Android project
        run: npx cap add android

      - name: Generate app icon and splash
        run: npx capacitor-assets generate --android
        continue-on-error: true

      - name: Copy web app into Android project
        run: npx cap sync android

      - name: Set version number
        run: sed -i "s/versionCode 1$/versionCode ${{ github.run_number }}/" android/app/build.gradle

      - name: Build APK
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          cd android
          chmod +x gradlew
          if [ -n "$KEYSTORE_B64" ]; then
            ./gradlew assembleRelease --no-daemon
            echo "$KEYSTORE_B64" | base64 -d > release.jks
            BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
            "$BT/zipalign" -p -f 4 app/build/outputs/apk/release/app-release-unsigned.apk aligned.apk
            "$BT/apksigner" sign --ks release.jks --ks-pass env:KS_PASS --key-pass env:KS_PASS \
              --ks-key-alias "$KS_ALIAS" --out ../NightShiftPhysique.apk aligned.apk
            rm release.jks
          else
            echo "::warning::No signing key in secrets. Building a debug APK; updates will need an uninstall."
            ./gradlew assembleDebug --no-daemon
            cp app/build/outputs/apk/debug/app-debug.apk ../NightShiftPhysique.apk
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: NightShiftPhysique-android
          path: NightShiftPhysique.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-${{ github.run_number }}
          name: App build ${{ github.run_number }}
          body: "Android: download NightShiftPhysique.apk on your phone and open it to install. iPhone: NightShiftPhysique.ipa is unsigned; install it with Sideloadly or AltStore from a computer."
          files: NightShiftPhysique.apk

  ios:
    needs: android
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Put app files into www and assets folders
        run: |
          mkdir -p www assets
          for f in index.html manifest.webmanifest sw.js icon-192.png icon-512.png; do
            if [ -f "$f" ] && [ ! -f "www/$f" ]; then cp "$f" www/; fi
          done
          for f in icon-only.png icon-foreground.png icon-background.png splash.png splash-dark.png; do
            if [ -f "$f" ] && [ ! -f "assets/$f" ]; then cp "$f" assets/; fi
          done

      - name: Install packages
        run: npm install

      - name: Create iOS project
        run: npx cap add ios

      - name: Generate app icon and splash
        run: npx capacitor-assets generate --ios
        continue-on-error: true

      - name: Copy web app into iOS project
        run: npx cap sync ios

      - name: Build unsigned iPhone app (.ipa)
        run: |
          cd ios/App
          if [ -d App.xcworkspace ]; then SRC="-workspace App.xcworkspace"; else SRC="-project App.xcodeproj"; fi
          xcodebuild $SRC -scheme App -configuration Release -sdk iphoneos -destination "generic/platform=iOS" \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} build
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/App.app Payload/
          zip -qr "$GITHUB_WORKSPACE/NightShiftPhysique.ipa" Payload

      - uses: actions/upload-artifact@v4
        with:
          name: NightShiftPhysique-ios
          path: NightShiftPhysique.ipa

      - name: Add iPhone app to the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-${{ github.run_number }}
          files: NightShiftPhysique.ipa
